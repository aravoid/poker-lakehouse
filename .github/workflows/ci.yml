name: tests
on: [push, pull_request]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[local,test]"
      - run: pytest -q

  dbt-build:
    # Spark builds the silver tables from synthetic hands, then dbt builds and tests the
    # analytics layer on DuckDB. A failing dbt test fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[local,dbt]"
      - run: python -m poker_pipeline.simulator --out data/sim --hands 3000 --files 3
      - run: python -m poker_pipeline.pipeline --raw "data/sim/*.phhs" --lake data/lake --format parquet
      - run: dbt build --project-dir dbt --profiles-dir dbt --target duckdb
        env:
          LAKE_PATH: ${{ github.workspace }}/data/lake
          DBT_DUCKDB_PATH: ${{ github.workspace }}/data/poker_gold.duckdb
